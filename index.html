<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Expense tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f3ee">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one 480px column, big amount + keypad on top, bottom tab bar (Log / History / Insights / Budget). */
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --surface-2: #F4F6F8;
  --ink: #121C26;
  --muted: #5A6978;
  --line: #D8DEE4;
  --accent: #0B6E5E;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFEA;
  --warn: #A9560C;
  --warn-soft: #F6E6D3;
  --bad: #B3261E;
  --bad-soft: #F6DAD7;
  --c-food: #D9822B;
  --c-transport: #2F7DD1;
  --c-groceries: #5BA34A;
  --c-shopping: #B05CC0;
  --c-bills: #7A8794;
  --c-fun: #D14B6A;
  --c-health: #1A9BA8;
  --c-other: #8A8F2A;
  --c-indigo: #5B63D3;
  --c-sand: #A0713F;
  --f-display: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1318; --surface: #151D24; --surface-2: #1B252E; --ink: #E7EDF2; --muted: #93A1AE; --line: #27333D;
    --accent: #3FCFB2; --accent-ink: #05211B; --accent-soft: #123A33;
    --warn: #F0A25A; --warn-soft: #3A2A18; --bad: #FF8A80; --bad-soft: #3D1F1D;
    --c-food: #F0A04B; --c-transport: #5AA2F0; --c-groceries: #7FC46E; --c-shopping: #CF86DE;
    --c-bills: #9AA7B3; --c-fun: #F07A97; --c-health: #46C4D1; --c-other: #B5BA4A; --c-indigo: #8A92F2; --c-sand: #C99A66;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1318; --surface: #151D24; --surface-2: #1B252E; --ink: #E7EDF2; --muted: #93A1AE; --line: #27333D;
  --accent: #3FCFB2; --accent-ink: #05211B; --accent-soft: #123A33;
  --warn: #F0A25A; --warn-soft: #3A2A18; --bad: #FF8A80; --bad-soft: #3D1F1D;
  --c-food: #F0A04B; --c-transport: #5AA2F0; --c-groceries: #7FC46E; --c-shopping: #CF86DE;
  --c-bills: #9AA7B3; --c-fun: #F07A97; --c-health: #46C4D1; --c-other: #B5BA4A; --c-indigo: #8A92F2; --c-sand: #C99A66;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--f-body);
  padding-block: 14px 104px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 480px; margin: 0 auto; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.brand i { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--accent); display: inline-block; position: relative; }
.brand i::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--accent); }
.top .when { color: var(--muted); font-size: 13px; text-align: right; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.good { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

/* Log */
.amount { display: flex; align-items: baseline; justify-content: center; gap: 6px; padding: 8px 0 14px; font-family: var(--f-mono); }
.amount .cur { font-size: 22px; color: var(--muted); }
.amount .val { font-size: 56px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; min-width: 0; overflow-wrap: anywhere; }
.amount .val.empty { color: var(--line); }
.cats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.cat { min-width: 0; text-align: center; line-height: 1.2; overflow-wrap: anywhere; background: var(--surface); border: 1.5px solid transparent; border-radius: 10px; padding: 9px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 500; }
.cat i { width: 10px; height: 10px; border-radius: 50%; background: var(--dot); }
.cat[aria-checked="true"] { border-color: var(--ink); background: var(--surface-2); font-weight: 600; }
.meta { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin: 10px 0; }
.field { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%; min-width: 0; }
.field::placeholder { color: var(--muted); }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.key { height: 54px; border-radius: 12px; border: 0; background: var(--surface); font-family: var(--f-mono); font-size: 22px; touch-action: manipulation; }
.key:active { background: var(--surface-2); }
.key.alt { color: var(--muted); }
.save { margin-top: 8px; width: 100%; height: 54px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 16px; }
.save:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 26px 0 8px; }
.section-head h2 { font-size: 17px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.list { background: var(--surface); border-radius: 12px; overflow: hidden; }
.row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 12px 8px 12px 14px; }
.row + .row { border-top: 1px solid var(--line); }
.row .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dot); }
.row .t { min-width: 0; }
.row .t b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t span { color: var(--muted); font-size: 12.5px; }
.row .amt { font-family: var(--f-mono); font-size: 15px; }
.x { width: 36px; height: 36px; border: 0; background: transparent; color: var(--muted); border-radius: 8px; display: grid; place-items: center; }
.x:hover { background: var(--surface-2); color: var(--bad); }
.empty-box { background: var(--surface); border-radius: 12px; padding: 20px 16px; color: var(--muted); }
.empty-box p { margin: 0 0 12px; }
.empty-box strong { color: var(--ink); font-weight: 600; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.quiet { background: transparent; }

/* History */
.day-head { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 2px 6px; }
.day-head h3 { font-size: 15px; }
.day-head span { color: var(--muted); font-size: 13px; }
.bar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.export-box { margin-top: 12px; background: var(--surface); border-radius: 12px; padding: 12px; }
.export-box textarea { width: 100%; height: 140px; resize: vertical; font-family: var(--f-mono); font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; color: var(--ink); }

/* Insights */
.seg { display: inline-grid; grid-auto-flow: column; background: var(--surface); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.hero { margin: 16px 0 4px; }
.hero .big { font-family: var(--f-mono); font-size: 40px; letter-spacing: -0.03em; line-height: 1.1; font-weight: 500; overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
.stat { background: var(--surface); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.stat .v { font-family: var(--f-mono); font-size: 16px; margin-top: 2px; overflow-wrap: anywhere; }
.stat .v.txt { font-family: var(--f-body); font-weight: 600; }
.chart { background: var(--surface); border-radius: 12px; padding: 12px 10px 6px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .ax { fill: var(--muted); font: 10px var(--f-body); }
.chart .ax.today { fill: var(--ink); font-weight: 700; }
.chart .pk { fill: var(--ink); font: 500 10px var(--f-mono); }
.chart .base { stroke: var(--line); stroke-width: 1; }
.chart .b { fill: var(--accent); }
.chart .b.lo { opacity: 0.42; }
.chart .b.zero { fill: var(--line); opacity: 1; }
.cat-list { background: var(--surface); border-radius: 12px; padding: 4px 14px; }
.cat-row { padding: 10px 0; }
.cat-row + .cat-row { border-top: 1px solid var(--line); }
.cat-row .h { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.cat-row .h span:first-child { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.cat-row .h i { width: 10px; height: 10px; border-radius: 50%; background: var(--dot); }
.cat-row .h small { color: var(--muted); font-family: var(--f-mono); font-size: 12px; margin-left: 6px; }
.track { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.track b { display: block; height: 100%; background: var(--dot); border-radius: 3px; }

/* Budget */
.gauge { background: var(--surface); border-radius: 12px; padding: 16px; }
.gauge .line1 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.gauge .big { font-family: var(--f-mono); font-size: 34px; letter-spacing: -0.03em; font-weight: 500; overflow-wrap: anywhere; }
.gauge .of { color: var(--muted); font-size: 13px; }
.meter { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; margin: 14px 0 6px; position: relative; }
.meter b { display: block; height: 100%; border-radius: 6px; background: var(--accent); }
.meter b.warn { background: var(--warn); }
.meter b.bad { background: var(--bad); }
.meter em { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: 0.6; }
.gauge .legend { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; gap: 8px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.bform { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-top: 8px; }
.note { color: var(--muted); font-size: 13px; margin: 10px 2px 0; }

.stat .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.facts .stat .v { font-size: 18px; }
.warn-text { color: var(--warn); }
.meter.sm { height: 8px; margin: 8px 0 0; border-radius: 4px; }
.meter.sm b { border-radius: 4px; }
.tlist { background: var(--surface); border-radius: 12px; padding: 4px 14px; }
.trow { padding: 12px 0; }
.trow + .trow { border-top: 1px solid var(--line); }
.trow .h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.trow .nm { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex-wrap: wrap; }
.trow .nm i { width: 10px; height: 10px; border-radius: 50%; background: var(--dot); align-self: center; flex: none; }
.trow .nm b { font-weight: 600; }
.trow .nm small { color: var(--muted); font-size: 12px; }
.trow .nums { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; font-size: 14px; flex-wrap: wrap; }
.trow .nums small { color: var(--muted); font-size: 12px; }
.bf { margin-top: 4px; }
.cbs { display: grid; gap: 6px; }
.cb-row { display: grid; grid-template-columns: minmax(0, 1fr) 130px; align-items: center; gap: 10px; }
.cb-row label { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.cb-row label i { width: 10px; height: 10px; border-radius: 50%; background: var(--dot); }
.alloc { margin: 14px 2px; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; font-size: 13.5px; }
.alloc.warn-text { background: var(--warn-soft); }

.cats-head { display: flex; justify-content: space-between; align-items: center; margin: 0 2px 6px; }
.link { border: 0; background: transparent; color: var(--accent); font-weight: 600; font-size: 14px; padding: 4px 2px; text-decoration: underline; text-underline-offset: 3px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.mlist { display: grid; gap: 6px; }
.mrow { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 8px; background: var(--surface); border-radius: 12px; padding: 6px 6px 6px 8px; }
.mrow .field { padding: 9px 10px; }
.mbtns { display: flex; gap: 0; align-items: center; }
.mbtns .x:disabled { opacity: 0.3; cursor: not-allowed; }
.mrow.confirm { grid-template-columns: 1fr; padding: 12px; }
.mrow.confirm p { margin: 0 0 10px; }
.mrow.confirm .mbtns { gap: 8px; }
.swatch { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; }
.swatch i, .pal i { width: 16px; height: 16px; border-radius: 50%; background: var(--dot); display: block; }
.palette { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px; background: var(--surface); border-radius: 12px; }
.pal { width: 36px; height: 36px; border-radius: 10px; border: 2px solid transparent; background: var(--surface-2); display: grid; place-items: center; }
.pal[aria-checked="true"] { border-color: var(--ink); }

.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); border: 0; white-space: nowrap; }
.sr-only:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
label.btn { display: inline-block; cursor: pointer; }
.export-box h3 { font-size: 16px; margin-bottom: 6px; }
.export-box textarea.paste { height: 90px; }
.impstats { margin: 8px 0 14px; padding-left: 18px; display: grid; gap: 5px; font-size: 14px; }

.food-box { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; }
.cb-head { display: flex; align-items: baseline; gap: 8px; font-weight: 600; flex-wrap: wrap; }
.cb-head i { width: 10px; height: 10px; border-radius: 50%; background: var(--dot); align-self: center; }
.cb-head small { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.food-box .field { background: var(--surface); }
.foodcalc { font-size: 13px; color: var(--muted); }

.help { margin-top: 14px; background: var(--surface); border-radius: 12px; padding: 10px 14px; font-size: 13.5px; }
.help summary { cursor: pointer; font-weight: 600; }
.help p { margin: 8px 0 0; color: var(--muted); overflow-wrap: anywhere; }
.help p.num { font-size: 12px; color: var(--ink); }

/* Tabs and toast */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabs-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tab { border: 0; background: transparent; padding: 7px 4px 5px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 6; width: calc(100% - 32px); max-width: 440px;
  background: var(--ink); color: var(--bg); border-radius: 12px; padding: 11px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; }
.toast button { border: 0; background: transparent; color: var(--accent-ink); font-weight: 700; padding: 4px 6px; }
.toast button { color: inherit; text-decoration: underline; }
.toast[hidden] { display: none; }
@media (prefers-reduced-motion: no-preference) {
  .meter b { transition: width .35s ease; }
  .key, .cat, .save { transition: background-color .12s ease, border-color .12s ease; }
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><i aria-hidden="true"></i>Expense tracker</div>
    <div class="when" id="when"></div>
  </header>
  <main id="view" aria-live="off"></main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-in">
    <button class="tab" data-tab="log"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Log</button>
    <button class="tab" data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg>History</button>
    <button class="tab" data-tab="insights"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-7"/></svg>Insights</button>
    <button class="tab" data-tab="budget"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".6"/></svg>Budget</button>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';
  var PALETTE = [['food', 'Orange'], ['transport', 'Blue'], ['groceries', 'Green'], ['shopping', 'Purple'], ['bills', 'Grey'], ['fun', 'Pink'], ['health', 'Teal'], ['other', 'Olive'], ['indigo', 'Indigo'], ['sand', 'Sand']];
  var PKEYS = PALETTE.map(function (p) { return p[0]; });
  var DEFAULT_CATS = [
    { id: 'food', name: 'Food', color: 'food' }, { id: 'transport', name: 'Transport', color: 'transport' },
    { id: 'groceries', name: 'Groceries', color: 'groceries' }, { id: 'shopping', name: 'Shopping', color: 'shopping' },
    { id: 'bills', name: 'Bills', color: 'bills' }, { id: 'fun', name: 'Fun', color: 'fun' },
    { id: 'health', name: 'Health', color: 'health' }, { id: 'other', name: 'Other', color: 'other' }
  ];
  var MAX_CATS = 16;
  var CATS = [], CAT = {};
  function hydrateCats(list) {
    var out = [], seen = {};
    if (Array.isArray(list)) list.forEach(function (c) {
      if (!c || typeof c.id !== 'string' || typeof c.name !== 'string' || seen[c.id] || out.length >= MAX_CATS) return;
      var name = c.name.trim().slice(0, 20);
      if (!name) return;
      seen[c.id] = true;
      out.push({ id: c.id, name: name, color: PKEYS.indexOf(c.color) >= 0 ? c.color : PKEYS[out.length % PKEYS.length] });
    });
    return out.length ? out : DEFAULT_CATS.map(function (c) { return { id: c.id, name: c.name, color: c.color }; });
  }
  function applyCats(list) {
    CATS = hydrateCats(list).map(function (c) { return { id: c.id, name: c.name, color: c.color, v: 'var(--c-' + c.color + ')' }; });
    CAT = {};
    CATS.forEach(function (c) { CAT[c.id] = c; });
    if (!CAT[S.cat]) S.cat = CATS[0].id;
  }
  function catListOut() { return CATS.map(function (c) { return { id: c.id, name: c.name, color: c.color }; }); }
  function catOf(id) { return CAT[id] || { id: '_none', name: 'Uncategorised', v: 'var(--c-bills)' }; }
  function catKey(id) { return CAT[id] ? id : '_none'; }

  // Example rows: [days ago, category, cents, note]
  var SAMPLE = [

  /* CSV import */

    var im = S.imp;
    if (!im) return '';
    if (im.stage === 'busy') return '<div class="export-box" role="status"><h3>Importing</h3><p class="note" style="margin:6px 0 0" id="impprog">' + im.done + ' of ' + im.total + '</p></div>';
    if (im.stage === 'pick') {
      return '<div class="export-box"><h3>Import CSV</h3>' +
        '<p class="note" style="margin:0 0 10px">Use a file exported from Expense tracker, or any CSV with Date, Category, Note and Amount columns. Dates read as YYYY-MM-DD.</p>' +
        (im.error ? '<p class="note warn-text" style="margin:0 0 10px" role="alert">' + esc(im.error) + '</p>' : '') +
        '<input type="file" id="csvfile" class="sr-only" accept=".csv,text/csv,text/plain"><label class="btn primary" for="csvfile">Choose CSV file</label>' +
        '<p class="note" style="margin:14px 0 6px">Or paste the CSV text</p>' +
        '<textarea id="csvpaste" class="paste" aria-label="Paste CSV text">' + esc(im.text || '') + '</textarea>' +
        '<div class="btnrow" style="margin-top:8px"><button class="btn" type="button" data-act="readcsv">Read pasted text</button><button class="btn quiet" type="button" data-act="impcancel">Cancel</button></div></div>';
    }
    var rows = im.rows, existing = {};
    S.entries.forEach(function (e) { existing[e.id] = true; });
    var dupes = rows.filter(function (r) { return r.id && existing[r.id]; }).length, fresh = rows.length - dupes;
    var dates = rows.map(function (r) { return r.date; }).sort(), total = rows.reduce(function (s, r) { return s + r.cents; }, 0);
    var known = {}, newNames = [], seenN = {};
    CATS.forEach(function (c) { known[c.name.toLowerCase()] = true; });
    rows.forEach(function (r) {
      var k = r.catName.toLowerCase();
      if (k && k !== 'uncategorised' && !known[k] && !seenN[k]) { seenN[k] = true; newNames.push(r.catName); }
    });
    var room = Math.max(0, MAX_CATS - CATS.length), overflow = Math.max(0, newNames.length - room);
    var keep = {}; rows.forEach(function (r) { if (r.id) keep[r.id] = true; });
    var dropCount = S.entries.filter(function (e) { return !keep[e.id]; }).length;
    var li = [];
    if (rows.length) li.push('<li><b>' + rows.length + '</b> ' + (rows.length === 1 ? 'row' : 'rows') + ' ready, ' + money(total) + ' in total, from ' + esc(dayLabel(dates[0])) + ' to ' + esc(dayLabel(dates[dates.length - 1])) + '.</li>');
    else li.push('<li class="warn-text">No usable rows found.</li>');
    if (dupes) li.push('<li>' + dupes + ' already in your history (same ID). Adding skips them.</li>');
    if (newNames.length) li.push('<li>New ' + (newNames.length === 1 ? 'category' : 'categories') + ' will be created: ' + esc(newNames.slice(0, 8).join(', ')) + (newNames.length > 8 ? ' and more' : '') + '.' + (overflow ? ' ' + overflow + ' over the limit of ' + MAX_CATS + ' will show as Uncategorised.' : '') + '</li>');
    if (im.bad.length) li.push('<li class="warn-text">' + im.bad.length + (im.bad.length === 1 ? ' problem: ' : ' problems: ') + esc(im.bad.slice(0, 3).join('; ')) + (im.bad.length > 3 ? '; and more' : '') + '. Those rows are skipped.</li>');
    if (im.dayFirst) li.push('<li>Dates like 03/04/2026 are read as day/month/year.</li>');
    li.push('<li>Rows without an ID are always added as new entries.</li>');
    var actions;
    if (im.confirm) {
      actions = '<p style="margin:0 0 10px"><b>Replace everything?</b> This deletes ' + dropCount + (dropCount === 1 ? ' entry' : ' entries') + ' you have now and keeps the ' + rows.length + ' from the file. Categories and budgets stay as they are.</p>' +
        '<div class="btnrow"><button class="btn danger" type="button" data-act="impreplace">Replace entries</button><button class="btn quiet" type="button" data-act="impback">Back</button></div>';
    } else {
      actions = '<div class="btnrow"><button class="btn primary" type="button" data-act="impadd"' + (fresh ? '' : ' disabled') + '>Add ' + fresh + ' new ' + (fresh === 1 ? 'entry' : 'entries') + '</button>' +
        '<button class="btn" type="button" data-act="impconfirm"' + (rows.length ? '' : ' disabled') + '>Replace all…</button><button class="btn quiet" type="button" data-act="impcancel">Cancel</button></div>';
    }
    return '<div class="export-box"><h3>Ready to import</h3><ul class="impstats">' + li.join('') + '</ul>' + actions + '</div>';
  }
  function impProgress(n) {
    if (S.imp && S.imp.stage === 'busy') { S.imp.done = n; var el = $('#impprog'); if (el) el.textContent = n + ' of ' + S.imp.total; }
  }
  async function runImport(mode) {
    var im = S.imp;
    if (!im || im.stage !== 'preview' || !store) return;
    var existing = {}; S.entries.forEach(function (e) { existing[e.id] = true; });
    var pick = mode === 'add' ? im.rows.filter(function (r) { return !(r.id && existing[r.id]); }) : im.rows;
    var list = catListOut(), byName = {}, used = {}, created = 0;
    list.forEach(function (c) { byName[c.name.toLowerCase()] = c.id; used[c.color] = (used[c.color] || 0) + 1; });
    pick.forEach(function (r) {
      var k = r.catName.toLowerCase();
      if (!k || k === 'uncategorised') { r.cat = '_none'; return; }
      if (byName[k]) { r.cat = byName[k]; return; }
      if (list.length >= MAX_CATS) { r.cat = '_none'; return; }
      var color = PKEYS.slice().sort(function (a, b) { return (used[a] || 0) - (used[b] || 0); })[0], id = 'c' + Math.random().toString(36).slice(2, 8);
      list.push({ id: id, name: r.catName, color: color }); used[color] = (used[color] || 0) + 1; byName[k] = id; r.cat = id; created++;
    });
    var entries = pick.map(function (r) { return { id: r.id || newId(), cents: r.cents, cat: r.cat, note: r.note, date: r.date, ts: r.ts }; });
    var keep = {}; entries.forEach(function (e) { keep[e.id] = true; });
    var drop = mode === 'replace' ? S.entries.filter(function (e) { return !keep[e.id]; }).map(function (e) { return e.id; }) : [];
    S.imp = { stage: 'busy', done: 0, total: entries.length + drop.length };
    renderAll();
    try {
      if (created) await store.setCatList(list);
      await store.addMany(entries, impProgress);
      if (drop.length) await store.removeMany(drop, function (n) { impProgress(entries.length + n); });
    } catch (e) {
      S.imp = null; renderAll();
      toast('Import stopped partway. Check History, then import the file again to finish.');
      return;
    }
    S.imp = null; renderAll();
    var ids = entries.map(function (e) { return e.id; });
    toast('Imported ' + entries.length + (entries.length === 1 ? ' entry' : ' entries') + (created ? ' and ' + created + ' new ' + (created === 1 ? 'category' : 'categories') : ''),
      mode === 'add' ? function () { guard(store.removeMany(ids), 'Could not undo the import.'); } : null);
  }

  /* Category manager */
  function renderCats() {
    var html = '<section aria-label="Categories"><div class="bar-row"><button class="btn quiet" type="button" data-act="backcats">← Back</button><h2>Categories</h2></div>' +
      '<p class="note" style="margin:10px 2px 12px">Rename, reorder, recolour, add or remove categories. This order is the order on the Log screen.</p><div class="mlist">';
    CATS.forEach(function (c, i) {
      if (S.confirmDel === c.id) {
        var n = S.entries.filter(function (e) { return e.cat === c.id; }).length;
        html += '<div class="mrow confirm"><p>Remove <b>' + esc(c.name) + '</b>? Its ' + n + (n === 1 ? ' entry stays' : ' entries stay') + ' in your history and show as Uncategorised.</p>' +
          '<div class="mbtns"><button class="btn" type="button" data-act="mdelno">Cancel</button><button class="btn danger" type="button" data-act="mdelok" data-id="' + esc(c.id) + '">Remove</button></div></div>';
        return;
      }
      html += '<div class="mrow" style="--dot:' + c.v + '"><button class="swatch" type="button" data-act="colorpick" data-id="' + esc(c.id) + '" aria-expanded="' + (S.colorOpen === c.id) + '" aria-label="Change colour of ' + esc(c.name) + '"><i></i></button>' +
        '<input class="field cname" data-id="' + esc(c.id) + '" value="' + esc(c.name) + '" maxlength="20" aria-label="Category name">' +
        '<div class="mbtns">' +
        '<button class="x" type="button" data-act="mup" data-id="' + esc(c.id) + '" aria-label="Move ' + esc(c.name) + ' up"' + (i === 0 ? ' disabled' : '') + '><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></svg></button>' +
        '<button class="x" type="button" data-act="mdown" data-id="' + esc(c.id) + '" aria-label="Move ' + esc(c.name) + ' down"' + (i === CATS.length - 1 ? ' disabled' : '') + '><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10l6 6 6-6"/></svg></button>' +
        '<button class="x" type="button" data-act="mdel" data-id="' + esc(c.id) + '" aria-label="Remove ' + esc(c.name) + '"' + (CATS.length <= 1 ? ' disabled' : '') + '><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>';
      if (S.colorOpen === c.id) {
        html += '<div class="palette" role="radiogroup" aria-label="Colour for ' + esc(c.name) + '">' + PALETTE.map(function (p) {
          return '<button type="button" class="pal" role="radio" aria-checked="' + (p[0] === c.color) + '" data-act="setcolor" data-id="' + esc(c.id) + '" data-color="' + p[0] + '" style="--dot:var(--c-' + p[0] + ')" aria-label="' + p[1] + '"><i></i></button>';
        }).join('') + '</div>';
      }
    });
    html += '</div><form id="addcat" class="bform" style="margin-top:12px"><input class="field" id="newcat" maxlength="20" autocomplete="off" placeholder="New category, e.g. Pets" aria-label="New category name"' + (CATS.length >= MAX_CATS ? ' disabled' : '') + '>' +
      '<button class="btn primary" type="submit"' + (CATS.length >= MAX_CATS ? ' disabled' : '') + '>Add</button></form>' +
      '<p class="note">' + CATS.length + ' of ' + MAX_CATS + ' categories.' + (CATS.length >= MAX_CATS ? ' Remove one to add another.' : '') + '</p>' +
      '<button class="btn" type="button" data-act="resetcats" style="margin-top:8px">Restore default categories</button></section>';
    $('#view').innerHTML = html;
  }
  function pushCats(list, msg, undoList) {
    guard(store.setCatList(list), 'Could not save your categories.');
    if (msg) toast(msg, undoList ? function () { guard(store.setCatList(undoList), 'Could not undo that.'); } : null);
  }
  function renameCat(id, v) {
    var name = v.trim().slice(0, 20), list = catListOut();
    list.forEach(function (c) { if (c.id === id && name) c.name = name; });
    pushCats(list);
    renderCats();
  }
  function moveCat(id, dir) {
    var list = catListOut(), i = list.map(function (c) { return c.id; }).indexOf(id), j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    var t = list[i]; list[i] = list[j]; list[j] = t;
    pushCats(list);
  }
  function removeCat(id) {
    if (CATS.length <= 1) return;
    var prev = catListOut(), c = catOf(id);
    S.confirmDel = null; S.colorOpen = null;
    pushCats(prev.filter(function (x) { return x.id !== id; }), 'Removed ' + c.name, prev);
  }
  function addCat(name) {
    name = name.trim().slice(0, 20);
    if (!name || CATS.length >= MAX_CATS) return;
    var used = {}; CATS.forEach(function (c) { used[c.color] = (used[c.color] || 0) + 1; });
    var color = PKEYS.slice().sort(function (a, b) { return (used[a] || 0) - (used[b] || 0); })[0];
    var list = catListOut(); list.push({ id: 'c' + Math.random().toString(36).slice(2, 8), name: name, color: color });
    pushCats(list);
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', function (ev) {
    var tab = ev.target.closest('.tab');
    if (tab) { setTab(tab.dataset.tab); return; }
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var a = el.dataset.act;
    if (a === 'key') pressKey(el.dataset.k);
    else if (a === 'cat') { S.cat = el.dataset.id; document.querySelectorAll('.cat').forEach(function (b) { b.setAttribute('aria-checked', String(b.dataset.id === S.cat)); }); }
    else if (a === 'save') saveExpense();
    else if (a === 'del') removeEntry(el.dataset.id);
    else if (a === 'sample') loadSample();
    else if (a === 'clearsample') clearSample();
    else if (a === 'export') exportCsv();
    else if (a === 'closecsv') { S.exportText = null; renderHistory(); }
    else if (a === 'copycsv') {
      var ta = $('#csvtext');
      var done = function () { toast('Copied to clipboard.'); };
      var fallback = function () { ta.focus(); ta.select(); toast('Press copy on the selected text.'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, fallback); else fallback();
    }
    else if (a === 'importcsv') { S.exportText = null; S.imp = { stage: 'pick', text: '' }; renderHistory(); }
    else if (a === 'impcancel') { S.imp = null; renderHistory(); }
    else if (a === 'readcsv') { var pt = $('#csvpaste'); if (pt) { S.imp.text = pt.value; startPreview(pt.value); } }
    else if (a === 'impadd') runImport('add');
    else if (a === 'impconfirm') { if (S.imp) S.imp.confirm = true; renderHistory(); }
    else if (a === 'impback') { if (S.imp) S.imp.confirm = false; renderHistory(); }
    else if (a === 'impreplace') runImport('replace');
    else if (a === 'editcats') { if (S.tab !== 'cats') S.prevTab = S.tab; S.tab = 'cats'; S.confirmDel = null; S.colorOpen = null; renderAll(); window.scrollTo(0, 0); }
    else if (a === 'backcats') { S.confirmDel = null; S.colorOpen = null; setTab(S.prevTab || 'log'); }
    else if (a === 'colorpick') { S.colorOpen = S.colorOpen === el.dataset.id ? null : el.dataset.id; renderCats(); }
    else if (a === 'setcolor') { var cl = catListOut(); cl.forEach(function (c) { if (c.id === el.dataset.id) c.color = el.dataset.color; }); S.colorOpen = null; pushCats(cl); }
    else if (a === 'mup') moveCat(el.dataset.id, -1);
    else if (a === 'mdown') moveCat(el.dataset.id, 1);
    else if (a === 'mdel') {
      var cnt = S.entries.filter(function (e) { return e.cat === el.dataset.id; }).length;
      if (cnt) { S.confirmDel = el.dataset.id; renderCats(); } else removeCat(el.dataset.id);
    }
    else if (a === 'mdelno') { S.confirmDel = null; renderCats(); }
    else if (a === 'mdelok') removeCat(el.dataset.id);
    else if (a === 'resetcats') { var before = catListOut(); pushCats(DEFAULT_CATS.map(function (c) { return { id: c.id, name: c.name, color: c.color }; }), 'Default categories restored', before); }
    else if (a === 'bview') { S.bview = el.dataset.v; renderBudget(); }
    else if (a === 'period') { S.period = el.dataset.p; renderInsights(); }
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'note') S.note = ev.target.value;
    if (ev.target.id === 'csvpaste' && S.imp) S.imp.text = ev.target.value;
    if (ev.target.id === 'budget' || (ev.target.classList && (ev.target.classList.contains('cb') || ev.target.classList.contains('fd')))) updateAlloc();
  });
  document.addEventListener('change', function (ev) {
    if (ev.target.id === 'dt') S.date = ev.target.value || todayStr();
    if (ev.target.id === 'csvfile') loadFile(ev.target.files && ev.target.files[0]);
    if (ev.target.classList && ev.target.classList.contains('cname')) renameCat(ev.target.dataset.id, ev.target.value);
  });
  document.addEventListener('submit', function (ev) {
    if (ev.target.id !== 'bform') return;
    ev.preventDefault();
    if (!store) return;
    var total = parseCents($('#budget').value), cats = {}, fw = $('#fd-wd'), fe = $('#fd-we');
    var fd = (fw && fe) ? { wd: parseCents(fw.value), we: parseCents(fe.value) } : S.foodDaily;
    document.querySelectorAll('.cb').forEach(function (i) { var c = parseCents(i.value); if (c > 0) cats[i.dataset.id] = c; });
    guard(store.setBudget(total, cats, fd), 'Could not save your budgets.');
    toast(total || fd.wd || fd.we || Object.keys(cats).length ? 'Budgets saved' : 'Budgets cleared');
  });
  document.addEventListener('submit', function (ev) {
    if (ev.target.id !== 'addcat') return;
    ev.preventDefault();
    var inp = $('#newcat'); if (!inp || !store) return;
    addCat(inp.value);
  });
  document.addEventListener('keydown', function (ev) {
    if (S.tab !== 'log' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    var tag = ev.target && ev.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (/^[0-9.]$/.test(ev.key)) { pressKey(ev.key); }
    else if (ev.key === 'Backspace') { pressKey('back'); ev.preventDefault(); }
    else if (ev.key === 'Enter' && tag !== 'BUTTON') { saveExpense(); }
  });

  S.date = todayStr();
  renderAll();
  try { window.addEventListener('hashchange', handleQuickAdd); } catch (e) { /* ignore */ }
  init();
})();
</script>
</body>
</html>
